<!doctype html><html lang="ru"><head><meta charset="utf-8">

</head><body><div class="tma-scrim"></div><div class="tma"><div class="tgbar"><a href="event.html">&#8249;</a><b>Запись на событие</b></div><div class="tma-body" style="padding-top:16px">
<div><h1 style="font-size:19px;margin:0 0 4px">Концерт «10 лет New Tone»</h1><p style="margin:0;color:var(--muted);font-size:14px">25 октября, 18:00</p></div>
<div><p class="sec-title">Кто идёт</p><div class="list" style="margin-top:8px">
<label class="check"><input type="checkbox" checked><div><p class="t">Я</p><p class="s">Нигора Каримова</p></div></label>
<label class="check"><input type="checkbox" checked><div><p class="t">Амир</p><p class="s">7 лет</p></div></label>
<label class="check"><input type="checkbox"><div><p class="t">Лола</p><p class="s">4 года</p></div></label>
<a class="row" href="kids.html"><p class="t" style="color:var(--purple)">+ Добавить ребёнка</p></a></div></div>
<div><p class="sec-title">Гости</p><div class="row" style="margin-top:8px"><div><p class="t">Можно привести ещё 2 гостей</p><p class="s">Отметьте, если придёте не одни</p></div><select style="font:inherit;padding:8px;border-radius:10px;border:1px solid var(--border)"><option>0</option><option>1</option><option>2</option></select></div></div>
<div class="field"><label>Телефон</label><div style="display:flex;gap:8px"><input value="+998 90 123-45-67" style="flex:1"><button style="flex:0 0 auto;padding:0 14px;border-radius:12px;border:1px solid var(--purple-line);background:var(--purple-tint);color:var(--purple);font-size:13px;font-weight:600">Из Telegram</button></div></div>
<a class="row" href="profile-edit.html"><div><p class="t">Остальные данные</p><p class="s">имя, почта, дети — из профиля</p></div><span class="pill">изменить</span></a>
<div class="field"><label>Комментарий школе · необязательно</label><textarea rows="2" placeholder="Например: придём с коляской"></textarea></div>
<label class="check"><input type="checkbox" checked><div><p class="t">Согласен на обработку данных</p><p class="s">Политика обработки данных</p></div></label>
</div><div class="mainbtn"><a href="ticket.html" class="">Записаться</a></div></div>
